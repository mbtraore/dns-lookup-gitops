name: Déploiement DNS Lookup Seamless
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement (dev ou prod)'
        required: true
        default: 'dev'
      domains:
        description: 'Domaines à vérifier (séparés par virgule)'
        required: true
        default: 'google.com,github.com'
      loop_interval:
        description: 'Intervalle en secondes (0 = one-shot)'
        required: false
        default: '300'
      image_tag:
        description: "Tag de l'image (défaut: timestamp)"
        required: false
        default: ''

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Indispensable pour permettre le git push
      packages: write     # Optionnel si tu utilises GitHub Packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # Important pour git push

      - name: Générer tag d'image
        run: |
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.setokaibas.com
          username: ${{ secrets.HARBOR_USERNAME }}      # À créer dans les secrets
          password: ${{ secrets.HARBOR_PASSWORD }}      # À créer dans les secrets

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          push: true
          tags: |
            harbor.setokaibas.com/project-dns/dns-lookup:${{ env.IMAGE_TAG }}
            harbor.setokaibas.com/project-dns/dns-lookup:latest

      - name: Installer yq
        run: |
          wget https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O yq
          chmod +x yq
          sudo mv yq /usr/local/bin/yq

      - name: Mettre à jour les manifests
        run: |
          OVERLAY="manifests/overlays/${{ inputs.environment }}"

          # Mise à jour du tag image dans kustomization.yaml
          yq -i ".images[0].newTag = \"${{ env.IMAGE_TAG }}\"" $OVERLAY/kustomization.yaml

          # Mise à jour des variables d'environnement
          yq -i ".spec.template.spec.containers[0].env[] |= select(.name == \"DOMAINS\").value = \"${{ inputs.domains }}\"" $OVERLAY/env-patch.yaml
          yq -i ".spec.template.spec.containers[0].env[] |= select(.name == \"LOOP_INTERVAL\").value = \"${{ inputs.loop_interval }}\"" $OVERLAY/env-patch.yaml

      - name: Commit et push les changements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # Token fourni automatiquement par GitHub
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add manifests/overlays/${{ inputs.environment }}/
          
          git commit -m "Deploy ${{ inputs.environment }}: domaines='${{ inputs.domains }}' loop=${{ inputs.loop_interval }} image=${{ env.IMAGE_TAG }}"

          # Utilise le GITHUB_TOKEN intégré avec les droits corrects
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          
          git push origin HEAD:main